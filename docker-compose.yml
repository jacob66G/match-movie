services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: match-movie-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - match-movie-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: match-movie-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    networks:
      - match-movie-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: match-movie-backend
    ports: 
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_THREADS_VIRTUAL_ENABLED=true
      - SPRING_AI_OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=${KEYCLOAK_ISSUER_URI}
      - SPRING_APP_SECURITY_CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SPRING_APP_SECURITY_KEYCLOAK_CLIENT_ID=${CLIENT_ID}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      -  match-movie-network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: match-movie-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    networks:
      - match-movie-network
volumes:
  postgres_data:

networks:
  match-movie-network:
    driver: bridge
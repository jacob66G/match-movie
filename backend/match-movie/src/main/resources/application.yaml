spring:
  profiles:
    active: ${APP_PROFILE:dev}
  application:
    name: match-movie

  threads:
    virtual:
      enabled: true

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
        one-indexed-parameters: false

  jpa:
    hibernate:
      ddl-auto: validate

  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false

logging:
  pattern:
    correlation: "[%X{requestId:-} %X{userId:-}] "
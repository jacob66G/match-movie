spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:match-movie-db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/homelab

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-open-ai-key}

  app:
    security:
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      keycloak:
        client-id: ${CLIENT_ID:match-movie-client}

logging:
  level:
    root: INFO
    com.matchmovie: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  app:
    security:
      cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS}
      keycloak:
        client-id: ${CLIENT_ID}

logging:
  level:
    root: WARN
    io.github.jacob66g.matchmovie: INFO
    org.springframework: WARN
    org.hibernate: WARN